name: Build Brotherhood APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - Brotherhood.zip
      - .github/workflows/android-build.yml

permissions:
  contents: read

concurrency:
  group: brotherhood-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARCHIVE: Brotherhood.zip
  BUILD_ROOT: ${{ github.workspace }}/.ci-extracted

jobs:
  build-apk:
    name: Unpack and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Brotherhood.zip
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$SOURCE_ARCHIVE" || {
            echo "ERROR: $SOURCE_ARCHIVE was not found in the repository root."
            exit 1
          }
          unzip -t "$SOURCE_ARCHIVE"
          sha256sum "$SOURCE_ARCHIVE" | tee Brotherhood.zip.sha256

      - name: Extract archive and locate Android project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          unzip -q "$SOURCE_ARCHIVE" -d "$BUILD_ROOT"

          mapfile -t SETTINGS_FILES < <(
            find "$BUILD_ROOT" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Android settings.gradle(.kts) was not found inside $SOURCE_ARCHIVE."
            find "$BUILD_ROOT" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          if [ "${#SETTINGS_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one Gradle root was found; refusing to choose an ambiguous project."
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          ANDROID_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          test -f "$ANDROID_DIR/gradlew" || {
            echo "ERROR: Gradle Wrapper script is missing: $ANDROID_DIR/gradlew"
            exit 1
          }
          test -f "$ANDROID_DIR/app/build.gradle.kts" -o -f "$ANDROID_DIR/app/build.gradle" || {
            echo "ERROR: Android app module was not found under $ANDROID_DIR/app."
            exit 1
          }

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.android_dir }}
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            test -f gradle/wrapper/WrapperDownloader.java || {
              echo "ERROR: gradle-wrapper.jar and the verified downloader are both missing."
              exit 1
            }
            java gradle/wrapper/WrapperDownloader.java gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Set up Gradle cache and validation
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -1)"
          fi
          test -n "$SDKMANAGER" -a -x "$SDKMANAGER" || {
            echo "ERROR: Android sdkmanager was not found on the GitHub runner."
            exit 1
          }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run unit tests and build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.android_dir }}
        run: |
          set -Eeuo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            testDebugUnitTest \
            assembleDebug

      - name: Collect APK and build metadata
        id: artifact
        shell: bash
        working-directory: ${{ steps.project.outputs.android_dir }}
        run: |
          set -Eeuo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-artifact"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          mapfile -t APKS < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: Gradle completed but no debug APK was found."
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          fi

          if [ "${#APKS[@]}" -eq 1 ]; then
            cp "${APKS[0]}" "$OUTPUT_DIR/Brotherhood-debug-${GITHUB_RUN_NUMBER}.apk"
          else
            for APK in "${APKS[@]}"; do
              cp "$APK" "$OUTPUT_DIR/Brotherhood-$(basename "$APK")"
            done
          fi

          cp "$GITHUB_WORKSPACE/Brotherhood.zip.sha256" "$OUTPUT_DIR/"
          (
            cd "$OUTPUT_DIR"
            sha256sum ./*.apk > APK_SHA256SUMS.txt
          )

          cat > "$OUTPUT_DIR/BUILD_INFO.txt" <<EOF
          project=Brotherhood
          source_archive=Brotherhood.zip
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF}
          run_id=${GITHUB_RUN_ID}
          run_number=${GITHUB_RUN_NUMBER}
          actor=${GITHUB_ACTOR}
          built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          java_version=17
          android_compile_sdk=36
          build_type=debug
          EOF

          echo "artifact_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          ls -lah "$OUTPUT_DIR"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Brotherhood-APK-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
